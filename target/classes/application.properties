server.port=8080
# lets ResponseStatusException messages reach the React app
server.error.include-message=always

# ---- MySQL (default). Create the DB first:  CREATE DATABASE projecthub;
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/projecthub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---- JWT (secret must be at least 32 characters; override in production)
app.jwt.secret=${JWT_SECRET:change-this-secret-to-a-long-random-string-123456}
app.jwt.expiration-ms=86400000

# ---- CORS (React dev server)
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:5173}

# ---- AI assistant. Leave the key empty to use the built-in offline suggestions.
app.ai.api-key=${ANTHROPIC_API_KEY:}
app.ai.model=${AI_MODEL:claude-sonnet-5-5}
